[package]
name = "lacre-adapter-http"
version = "0.1.0"
edition = "2021"

[dependencies]
lacre-core = { path = "../lacre-core" }
lacre-domain = { path = "../lacre-domain" }
lacre-profiles = { path = "../lacre-profiles" }
lacre-adapter-declarative = { path = "../lacre-adapter-declarative" }
lacre-adapter-ws = { path = "../lacre-adapter-ws" }
axum = { version = "0.8.9", features = ["ws"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.8.7"
hex = "0.4.3"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
